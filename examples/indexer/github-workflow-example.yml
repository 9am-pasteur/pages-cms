name: Build Pages CMS Indexes

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'indexes/**'
      - 'indexes-public/**'
  workflow_dispatch:
    inputs:
      force_index_rebuild:
        description: 'Force CMS index rebuild (0/1)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      force_public_index_rebuild:
        description: 'Force public index rebuild (0/1)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: write

concurrency:
  group: pages-cms-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-save --no-package-lock yaml @ltd/j-toml glob

      - name: Build indexes (if scripts exist)
        env:
          FORCE_INDEX_REBUILD: ${{ github.event.inputs.force_index_rebuild || '0' }}
          FORCE_PUBLIC_INDEX_REBUILD: ${{ github.event.inputs.force_public_index_rebuild || '0' }}
        run: |
          set -e

          if [ -f scripts/build-index.mjs ]; then
            echo "Run scripts/build-index.mjs"
            node scripts/build-index.mjs
          else
            echo "Skip CMS index build: scripts/build-index.mjs not found"
          fi

          if [ -f scripts/build-public-index.mjs ]; then
            echo "Run scripts/build-public-index.mjs"
            node scripts/build-public-index.mjs
          else
            echo "Skip public index build: scripts/build-public-index.mjs not found"
          fi

      - name: Commit indexes if changed
        run: |
          set -e

          if git status --porcelain | grep .; then
            git config user.name "pages-cms-bot"
            git config user.email "pages-cms-bot@example.com"

            # Avoid non-fast-forward failures when multiple index jobs race.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

            CONTENT_SHA=$(git rev-parse HEAD)
            git add indexes indexes-public 2>/dev/null || true
            git add -A
            git commit -m "chore: update indexes (content @ ${CONTENT_SHA}) [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
          else
            echo "No index changes"
          fi
